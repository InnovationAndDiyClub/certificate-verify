<!DOCTYPE html>
<html>
<head>
  <title>Admin Panel - Bulk Upload</title>
</head>
<body>

<div id="app"></div>

<div id="output"></div>

<!-- QR Library -->
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC5edGbUJ_7asC1w2ZF_dFWX0SoSArz8T8",
    authDomain: "certificate-authenticati-dfbe5.firebaseapp.com",
    projectId: "certificate-authenticati-dfbe5",
    storageBucket: "certificate-authenticati-dfbe5.firebasestorage.app",
    messagingSenderId: "1090557897061",
    appId: "1:1090557897061:web:20b6396302b6c527b8d98c",
    measurementId: "G-JL3DF70DPL"
  };
  
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// 🔐 Auth Check
onAuthStateChanged(auth, (user) => {
  if (!user) {
    document.body.innerHTML = `
      <style>
        body {
          margin: 0;
          font-family: 'Inter', sans-serif;
          background: #f5f7fa;
          display: flex;
          justify-content: center;
          align-items: center;
          height: 100vh;
        }

        .login-container {
          width: 380px;
          background: white;
          border: 1px solid #e5e7eb;
          padding: 30px;
          animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
          from { opacity: 0; transform: translateY(20px);}
          to { opacity: 1; transform: translateY(0);}
        }

        .title { font-size: 20px; margin-bottom: 20px; }
        .input {
          width: 100%;
          padding: 10px;
          margin-bottom: 15px;
          border: 1px solid #d1d5db;
        }
        .btn {
          width: 100%;
          padding: 10px;
          background: #111827;
          color: white;
          border: none;
          cursor: pointer;
        }
      </style>

      <div class="login-container">
        <div class="title">Admin Login</div>
        <input id="email" class="input" placeholder="Email">
        <input id="password" type="password" class="input" placeholder="Password">
        <button class="btn" onclick="login()">Login</button>
      </div>
    `;
  } else {
    loadDashboard();
  }
});

function loadDashboard() {
  document.body.innerHTML = `
    <style>
      body {
        margin: 0;
        font-family: 'Inter', sans-serif;
        background: #f5f7fa;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      .container {
        width: 450px;
        background: white;
        border: 1px solid #e5e7eb;
        padding: 30px;
        animation: fadeIn 0.5s ease;
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px);}
        to { opacity: 1; transform: translateY(0);}
      }

      .title {
        font-size: 18px;
        margin-bottom: 15px;
      }

      .file-input {
        margin-bottom: 15px;
      }

      .btn {
        width: 100%;
        padding: 10px;
        background: #111827;
        color: white;
        border: none;
        cursor: pointer;
      }

      .output {
        margin-top: 20px;
        max-height: 200px;
        overflow-y: auto;
        font-size: 13px;
      }

      .card {
        border: 1px solid #e5e7eb;
        padding: 10px;
        margin-bottom: 10px;
      }
    </style>

    <div class="container">
      <div class="title">Bulk Upload Certificates</div>

      <input type="file" id="fileInput" class="file-input">
      <button class="btn" onclick="uploadCSV()">Upload CSV</button>

      <div id="output" class="output"></div>
    </div>
  `;
}

// 🔐 Login
window.login = function() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  signInWithEmailAndPassword(auth, email, password)
    .then(() => location.reload())
    .catch(err => alert(err.message));
};

// 📊 Upload CSV
window.uploadCSV = async function() {
  const file = document.getElementById("fileInput").files[0];
  if (!file) return alert("Please select a file");

  const text = await file.text();
  const rows = text.split(/\r?\n/).slice(1);

  for (let i = 0; i < rows.length; i++) {
    if (!rows[i].trim()) continue;

    const [name, email, event, date, role] = rows[i].split(",").map(value => value.trim());

    const id = `MITS-HACK-${String(i+1).padStart(3,'0')}`;

    await setDoc(doc(db, "certificates", id), {
      Name: name,
      Email: email,
      Event: event,
      Date: date,
      Role: role,
      "Issued by": "Innovation and DIY club"
    });

    const qrLink = `${window.location.origin}/certificate-verify.html?id=${encodeURIComponent(id)}`;
    const templateLink = `${window.location.origin}/certificate-template.html?id=${encodeURIComponent(id)}`;

    const container = document.createElement("div");

    container.innerHTML = `
      <p><strong>${name}</strong> → ${id}</p>
      <a href="${qrLink}" target="_blank">Open Link</a>
      <br>
      <a href="${templateLink}" target="_blank">Open Certificate Template</a>
    `;

    const canvas = document.createElement("canvas");
    QRCode.toCanvas(canvas, qrLink);

    container.appendChild(canvas);
    document.getElementById("output").appendChild(container);
  }
};
</script>

</body>
</html>
