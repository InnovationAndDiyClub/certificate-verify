<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Certificate Verification</title>

<style>
  body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: #f5f7fa;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  .container {
    width: 450px;
    background: white;
    border: 1px solid #e5e7eb;
    padding: 25px;
    animation: fadeIn 0.6s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px);}
    to { opacity: 1; transform: translateY(0);}
  }

  /* 🔥 HEADER LOGOS */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }

  .logo {
    height: 50px;
    object-fit: contain;
  }

  .status {
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 8px;
  }

  .verified {
    color: #16a34a;
  }

  .invalid {
    color: #dc2626;
  }

  .subtext {
    font-size: 13px;
    color: #6b7280;
    margin-bottom: 15px;
  }

  .badge {
    display: inline-block;
    border: 1px solid #16a34a;
    color: #16a34a;
    padding: 4px 10px;
    font-size: 12px;
    margin-bottom: 10px;
  }

  .divider {
    height: 1px;
    background: #e5e7eb;
    margin: 15px 0;
  }

  .row {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    padding: 6px 0;
  }

  .label {
    color: #6b7280;
  }

  .value {
    font-weight: 500;
    color: #111827;
  }

</style>
</head>

<body>

<div class="container">

  <!-- 🔥 LOGO SECTION -->
  <div class="header">
    <img src="assets/photos/iete-logo.png" class="logo" alt="IETE Logo">
    <img src="assets/photos/diy-club-logo.png" class="logo" alt="DIY Club Logo">
  </div>

  <div id="result">Checking certificate...</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC5edGbUJ_7asC1w2ZF_dFWX0SoSArz8T8",
    authDomain: "certificate-authenticati-dfbe5.firebaseapp.com",
    projectId: "certificate-authenticati-dfbe5",
    storageBucket: "certificate-authenticati-dfbe5.firebasestorage.app",
    messagingSenderId: "1090557897061",
    appId: "1:1090557897061:web:20b6396302b6c527b8d98c",
    measurementId: "G-JL3DF70DPL"
  };

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/\"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

async function verifyCertificate(id) {
  const resultDiv = document.getElementById("result");
  
  // Try Firestore first
  const docRef = doc(db, "certificates", id);
  const docSnap = await getDoc(docRef);

  if (docSnap.exists()) {
    const data = docSnap.data();
    const certId = escapeHtml(id);

    resultDiv.innerHTML = `
      <div class="badge">VERIFIED</div>
      <div class="status verified">Certificate Verified</div>
      <div class="subtext">${escapeHtml(data.Event)}</div>

      <div class="divider"></div>

      <div class="row">
        <span class="label">Certificate ID</span>
        <span class="value">${certId}</span>
      </div>

      <div class="row">
        <span class="label">Name</span>
        <span class="value">${escapeHtml(data.Name)}</span>
      </div>

      <div class="row">
        <span class="label">Email</span>
        <span class="value">${escapeHtml(data.Email)}</span>
      </div>

      <div class="row">
        <span class="label">Date</span>
        <span class="value">${escapeHtml(data.Date)}</span>
      </div>

      <div class="row">
        <span class="label">Role</span>
        <span class="value">${escapeHtml(data.Role)}</span>
      </div>

      <div class="row">
        <span class="label">Issued By</span>
        <span class="value">${escapeHtml(data["Issued by"])}</span>
      </div>

      <div class="divider"></div>
      <a href="certificate-template.html?id=${encodeURIComponent(id)}">Open Printable Certificate</a>
    `;
  } else if (id.startsWith("IBF-")) {
    // Fallback: Try new API for IBF pattern
    try {
      const apiUrl = "https://script.google.com/macros/s/AKfycbwbayl9wgTMYtgULF5CBgO_-RRS0SrLCIpMG7VyIS06dnDvUbcbXcrtTNeC-tkWnmqw/exec?ref=" + encodeURIComponent(id);
      const response = await fetch(apiUrl);
      const apiData = await response.json();
      
      if (apiData && apiData.status === "VALID") {
        const certId = escapeHtml(apiData.ref);
        resultDiv.innerHTML = `
          <div class="badge">VERIFIED</div>
          <div class="status verified">Certificate Verified</div>
          <div class="subtext">Innovation & DIY Club</div>

          <div class="divider"></div>

          <div class="row">
            <span class="label">Certificate ID</span>
            <span class="value">${certId}</span>
          </div>

          <div class="row">
            <span class="label">Name</span>
            <span class="value">${escapeHtml(apiData.name)}</span>
          </div>

          <div class="row">
            <span class="label">Email</span>
            <span class="value">${escapeHtml(apiData.email)}</span>
          </div>

          <div class="row">
            <span class="label">Role</span>
            <span class="value">${escapeHtml(apiData.role)}</span>
          </div>

          <div class="row">
            <span class="label">Issued By</span>
            <span class="value">Innovation and DIY club</span>
          </div>
        `;
      } else {
        resultDiv.innerHTML = `
          <div class="status invalid">Invalid Certificate</div>
          <div class="subtext">This certificate does not exist in our records.</div>
        `;
      }
    } catch (error) {
      resultDiv.innerHTML = `
        <div class="status invalid">Verification Error</div>
        <div class="subtext">${error.message}</div>
      `;
    }
  } else {
    resultDiv.innerHTML = `
      <div class="status invalid">Invalid Certificate</div>
      <div class="subtext">This certificate does not exist in our records.</div>
    `;
  }
}

const params = new URLSearchParams(window.location.search);
const certId = params.get("id") || params.get("certificateId");

if (certId && certId.trim()) {
  verifyCertificate(certId.trim());
} else {
  document.getElementById("result").innerHTML = "No Certificate ID Provided";
}
</script>

</body>
</html>
