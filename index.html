<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Certificate Verification</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111827;
      color: #f9fafb;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    .card {
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 14px;
      padding: 32px;
      width: min(90vw, 420px);
      text-align: center;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.45);
    }
    h1 {
      margin-bottom: 10px;
    }
    #result {
      margin-top: 18px;
      line-height: 1.6;
      font-size: 1rem;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Certificate Verification</h1>
    <p>Please wait while we verify your certificate.</p>
    <div id="result">⏳ Verifying…</div>
  </div>

<script>
  const params = new URLSearchParams(window.location.search);
  const ref = params.get("ref");
  const id = params.get("id");
  const resultEl = document.getElementById("result");
  
  // Old system API (CFI-310126 pattern)
  const OLD_API_BASE =
    "https://script.google.com/macros/s/AKfycbyXHJMdYUDDxDw5Ua2SOh5qU7S8TWUDphQruiziebESM-SSrc1y-yHzmJV88gvALSaa/exec?ref=";
  
  // New system API (IBF-030426 pattern)
  const NEW_API_BASE =
    "https://script.google.com/macros/s/AKfycbwbayl9wgTMYtgULF5CBgO_-RRS0SrLCIpMG7VyIS06dnDvUbcbXcrtTNeC-tkWnmqw/exec?ref=";

  function detectRefSystem(rawRef) {
    const input = (rawRef || "").trim().toUpperCase();
    if (input.startsWith("IBF-")) {
      return "new";
    } else if (input.startsWith("CFI-") || input.match(/^[0-9]{6}-/)) {
      return "old";
    }
    return "unknown";
  }

  function buildRefCandidates(rawRef) {
    const input = (rawRef || "").trim().toUpperCase();
    const set = new Set();

    if (!input) return [];

    set.add(input);

    if (!input.startsWith("CFI-")) {
      set.add("CFI-" + input);
    }

    // Some old links were generated with a missing final alphanumeric char.
    const normalized = input.startsWith("CFI-") ? input : "CFI-" + input;
    const parts = normalized.split("-");
    const suffix = parts[parts.length - 1] || "";
    if (/^[A-Z0-9]{6}$/.test(suffix)) {
      for (let d = 0; d <= 9; d++) {
        set.add(normalized + String(d));
      }
    }

    return Array.from(set);
  }

  async function verifyByRef(rawRef) {
    const system = detectRefSystem(rawRef);
    const apiBase = system === "new" ? NEW_API_BASE : OLD_API_BASE;
    
    // For new system, try direct match only
    if (system === "new") {
      const input = rawRef.trim().toUpperCase();
      const url = apiBase + encodeURIComponent(input);
      const res = await fetch(url);
      if (!res.ok) throw new Error("Network error");
      const data = await res.json();
      if (data && data.status === "VALID") {
        return data;
      }
      return null;
    }

    // For old system, try with fallback candidates
    const refsToTry = buildRefCandidates(rawRef);
    for (const currentRef of refsToTry) {
      const url = apiBase + encodeURIComponent(currentRef);
      const res = await fetch(url);
      if (!res.ok) {
        throw new Error("Network error");
      }
      const data = await res.json();
      if (data && data.status === "VALID") {
        return data;
      }
    }

    return null;
  }

  if (id) {
    const target = "certificate-verify.html?id=" + encodeURIComponent(id.trim());
    window.location.replace(target);
  } else if (!ref) {
    resultEl.innerHTML = "❌ Reference number missing in QR code.";
  } else {
    verifyByRef(ref)
      .then(data => {
        if (data && data.status === "VALID") {
          // Handle both old and new system response formats
          const system = detectRefSystem(ref);
          let html = `✅ <b>Certificate Verified</b><br><br>`;
          html += `<b>Reference No:</b> ${data.ref}<br>`;
          html += `<b>Name:</b> ${data.name}<br>`;
          
          if (system === "old") {
            // Old system fields
            html += `<b>Enrollment:</b> ${data.enrollment || "—"}<br>`;
            html += `<b>Branch:</b> ${data.branch || "—"}<br>`;
            html += `<b>Year:</b> ${data.year || "—"}`;
          } else {
            // New system fields
            html += `<b>Email:</b> ${data.email || "—"}<br>`;
            html += `<b>Role:</b> ${data.role || "—"}`;
          }
          
          resultEl.innerHTML = html;
        } else {
          resultEl.innerHTML = `❌ Invalid Certificate<br><small>Checked ref: ${ref}</small>`;
        }
      })
      .catch(() => {
        resultEl.innerHTML = "❌ Verification failed";
      });
  }
</script>

</body>
</html>
