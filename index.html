<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Certificate Verification</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111827;
      color: #f9fafb;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    .card {
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 14px;
      padding: 32px;
      width: min(90vw, 420px);
      text-align: center;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.45);
    }
    h1 {
      margin-bottom: 10px;
    }
    #result {
      margin-top: 18px;
      line-height: 1.6;
      font-size: 1rem;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Certificate Verification</h1>
    <p>Please wait while we verify your certificate.</p>
    <div id="result">⏳ Verifying…</div>
  </div>

<script>
  const params = new URLSearchParams(window.location.search);
  const ref = params.get("ref");
  const id = params.get("id");
  const resultEl = document.getElementById("result");
  const API_BASE =
    "https://script.google.com/macros/s/AKfycbyXHJMdYUDDxDw5Ua2SOh5qU7S8TWUDphQruiziebESM-SSrc1y-yHzmJV88gvALSaa/exec?ref=";

  function buildRefCandidates(rawRef) {
    const input = (rawRef || "").trim().toUpperCase();
    const set = new Set();

    if (!input) return [];

    set.add(input);

    if (!input.startsWith("CFI-")) {
      set.add("CFI-" + input);
    }

    // Some old links were generated with a missing final alphanumeric char.
    const normalized = input.startsWith("CFI-") ? input : "CFI-" + input;
    const parts = normalized.split("-");
    const suffix = parts[parts.length - 1] || "";
    if (/^[A-Z0-9]{6}$/.test(suffix)) {
      for (let d = 0; d <= 9; d++) {
        set.add(normalized + String(d));
      }
    }

    return Array.from(set);
  }

  async function verifyByRef(rawRef) {
    const refsToTry = buildRefCandidates(rawRef);

    for (const currentRef of refsToTry) {
      const url = API_BASE + encodeURIComponent(currentRef);
      const res = await fetch(url);
      if (!res.ok) {
        throw new Error("Network error");
      }
      const data = await res.json();
      if (data.status === "VALID") {
        return data;
      }
    }

    return null;
  }

  if (id) {
    const target = "certificate-verify.html?id=" + encodeURIComponent(id.trim());
    window.location.replace(target);
  } else if (!ref) {
    resultEl.innerHTML = "❌ Reference number missing in QR code.";
  } else {
    verifyByRef(ref)
      .then(data => {
        if (data && data.status === "VALID") {
          resultEl.innerHTML = `
            ✅ <b>Certificate Verified</b><br><br>
            <b>Reference No:</b> ${data.ref}<br>
            <b>Name:</b> ${data.name}<br>
            <b>Enrollment:</b> ${data.enrollment}<br>
            <b>Branch:</b> ${data.branch}<br>
            <b>Year:</b> ${data.year}
          `;
        } else {
          resultEl.innerHTML = `❌ Invalid Certificate<br><small>Checked ref: ${ref}</small>`;
        }
      })
      .catch(() => {
        resultEl.innerHTML = "❌ Verification failed";
      });
  }
</script>

</body>
</html>
